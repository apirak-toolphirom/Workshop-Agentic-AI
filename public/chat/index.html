<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px;color:#172033;background:#f6f8fb}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.controls{display:flex;gap:8px;flex-wrap:wrap}select,input,button{font:inherit;padding:9px 11px;border:1px solid #ccd5e3;border-radius:9px}input{min-width:220px}.chat{min-height:55vh;background:#fff;border:1px solid #dbe2ed;border-radius:14px;padding:16px;margin:16px 0}.bubble{max-width:78%;padding:10px 14px;border-radius:14px;margin:9px 0;white-space:pre-wrap}.user{background:#dce7ff;margin-left:auto}.assistant{background:#edf0f5}.composer{display:flex;gap:8px}.composer input{flex:1}@media(max-width:600px){.bubble{max-width:90%}}</style></head>
<body><div class="top"><h1>💬 AI Desk Chat</h1><a href="/">กลับ Portal</a></div>
<div class="controls"><label>Provider <select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label>Model <input id="model" type="text" placeholder="ใช้ค่า default จากระบบ"></label></div>
<main id="chat" class="chat" aria-live="polite"><div class="bubble assistant">สวัสดีครับ พิมพ์ข้อความเพื่อเริ่มคุยได้เลย</div></main>
<form id="form" class="composer"><input id="message" autocomplete="off" placeholder="พิมพ์ข้อความ..." required><button>ส่ง</button></form><script src="/chat/app.js"></script></body></html>
