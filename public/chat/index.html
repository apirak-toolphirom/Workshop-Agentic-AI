<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title>
<style>
  :root {
    --bg-1: #fffaf5;
    --bg-2: #eef5ff;
    --panel: rgba(255, 255, 255, 0.74);
    --panel-strong: #ffffff;
    --border: #e8ddff;
    --text: #2f2a3d;
    --muted: #665f78;
    --lavender: #d9ccff;
    --peach: #ffd9c7;
    --mint: #d8f4e3;
    --sky: #dfeeff;
    --button: #b7c7ff;
    --button-hover: #9eafff;
    --shadow: rgba(125, 106, 165, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 26px 20px 32px;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 3vw, 2.5rem);
  }

  .top a {
    color: var(--text);
    text-decoration: none;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    transition: background 0.18s ease;
  }

  .top a:hover {
    background: rgba(255,255,255,0.8);
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: end;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 10px 24px var(--shadow);
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  select, input, button {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid #d9d0f6;
    border-radius: 12px;
    background: rgba(255,255,255,0.8);
    color: var(--text);
  }

  input {
    min-width: 220px;
  }

  button {
    background: linear-gradient(135deg, var(--button), #d7d1ff);
    border-color: #c7d1ff;
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.18s ease, filter 0.18s ease;
  }

  button:hover {
    transform: translateY(-1px);
    filter: brightness(1.03);
  }

  .chat {
    min-height: 55vh;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 16px;
    margin: 18px 0 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 12px 26px var(--shadow);
  }

  .bubble {
    max-width: 78%;
    padding: 12px 14px;
    border-radius: 16px 16px 16px 6px;
    margin: 10px 0;
    white-space: pre-wrap;
    line-height: 1.5;
    box-shadow: 0 6px 14px rgba(117, 100, 176, 0.08);
  }

  .user {
    background: linear-gradient(135deg, var(--sky), #e9d9ff);
    margin-left: auto;
    border-radius: 16px 16px 6px 16px;
  }

  .assistant {
    background: linear-gradient(135deg, #f7f1ff, #fcefe5);
  }

  .composer {
    display: flex;
    gap: 10px;
  }

  .composer input {
    flex: 1;
    min-width: 0;
  }

  @media (max-width: 600px) {
    .bubble { max-width: 90%; }
    .composer { flex-direction: column; }
    .controls { flex-direction: column; align-items: stretch; }
    input { min-width: 0; width: 100%; }
  }
</style></head>
<body>
  <div class="top">
    <h1>💬 AI Desk Chat</h1>
    <a href="/">กลับ Portal</a>
  </div>

  <div class="controls">
    <label>Provider
      <select id="provider">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="openai-compat">Custom gateway</option>
      </select>
    </label>
    <label>Model
      <select id="model">
        <option value="">ใช้ค่า default จากระบบ</option>
      </select>
    </label>
  </div>

  <main id="chat" class="chat" aria-live="polite">
    <div class="bubble assistant">สวัสดีครับ พิมพ์ข้อความเพื่อเริ่มคุยได้เลย</div>
  </main>

  <form id="form" class="composer">
    <input id="message" autocomplete="off" placeholder="พิมพ์ข้อความ..." required>
    <button>ส่ง</button>
  </form>

  <script src="/chat/app.js"></script>
</body>
</html>
